[project]
name = "xposure"
version = "5.0.0"
description = "Shit your DevOps forgot."
authors = [{name = "SnailSploit"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "aiohttp>=3.9.0",
    "aiodns>=3.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "esprima>=4.0",            # JS AST parsing (replaced pyjsparser)
    "jsbeautifier>=1.14.0",   # JS beautification
]

[project.optional-dependencies]
recon = [
    "anthropic>=0.40.0",
    "shodan>=1.31.0",
]
git = [
    "gitpython>=3.1",
]
db = [
    "pymongo>=4.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
]
full = [
    "anthropic>=0.40.0",
    "shodan>=1.31.0",
    "gitpython>=3.1",
    "pymongo>=4.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "cryptography>=41.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
xposure = "xposure.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
