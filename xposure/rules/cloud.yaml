rules:
  # AWS
  - id: aws_access_key
    name: AWS Access Key ID
    type: aws_access_key
    severity: critical
    pattern: '(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}'
    pair_with: aws_secret_key
    verifier: aws
    metadata:
      provider: aws
      service: iam
      docs: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
    remediation: |
      1. Go to AWS IAM Console
      2. Identify the IAM user/role
      3. Deactivate the access key immediately
      4. Rotate credentials and update services
      5. Delete the compromised key

  - id: aws_secret_key
    name: AWS Secret Access Key
    type: aws_secret_key
    severity: critical
    # Must be in assignment context with variable name
    pattern: '(?:aws_secret_access_key|AWS_SECRET_ACCESS_KEY|secret_access_key|secretAccessKey|aws_secret_key|AWS_SECRET_KEY)[\s"''=:]+([A-Za-z0-9/+]{40})'
    capture_group: 1
    pair_with: aws_access_key
    exclude_patterns:
      - '^[A-Za-z]{40}$'
      - '^[0-9]{40}$'
      - '(.)\1{5,}'
      - 'EXAMPLE'
      - 'example'
      - 'xxxx'
    verifier: aws
    metadata:
      provider: aws
      service: iam

  - id: aws_secret_key_generic
    name: AWS Secret Access Key (Generic Context)
    type: aws_secret_key
    severity: high
    # Fallback - requires AWS access key in context
    pattern: '[A-Za-z0-9/+]{40}'
    context_required: true
    context_patterns:
      - 'AKIA[A-Z0-9]{16}'
      - 'ASIA[A-Z0-9]{16}'
    exclude_patterns:
      - '^[A-Za-z]{40}$'
      - '^[0-9]{40}$'
      - '(.)\1{5,}'
      - 'AAAA'
      - 'eNp'
      - 'H4sI'
      - '==$'
    metadata:
      provider: aws
      service: iam

  - id: aws_session_token
    name: AWS Session Token
    type: aws_session_token
    severity: high
    pattern: 'FwoGZXIvYXdz[A-Za-z0-9/+=]{200,}'
    metadata:
      provider: aws
      service: sts

  # GCP
  - id: gcp_api_key
    name: GCP API Key
    type: gcp_api_key
    severity: high
    pattern: 'AIza[0-9A-Za-z\-_]{35}'
    verifier: gcp
    metadata:
      provider: gcp
      docs: https://cloud.google.com/docs/authentication/api-keys

  - id: gcp_service_account
    name: GCP Service Account Key
    type: gcp_service_account
    severity: critical
    pattern: '\{[^}]*"type"\s*:\s*"service_account"[^}]*\}'
    multiline: true
    verifier: gcp
    metadata:
      provider: gcp
      service: iam

  - id: gcp_oauth_token
    name: GCP OAuth Access Token
    type: gcp_oauth
    severity: high
    pattern: 'ya29\.[0-9A-Za-z\-_]+'
    metadata:
      provider: gcp

  # Azure
  - id: azure_client_secret
    name: Azure Client Secret
    type: azure_client_secret
    severity: critical
    pattern: '[a-zA-Z0-9~_.\-]{34,}'
    pair_with:
      - azure_client_id
      - azure_tenant_id
    context_required: true
    context_patterns:
      - 'azure'
      - 'client_secret'
      - 'AZURE_'
    verifier: azure
    metadata:
      provider: azure

  - id: azure_client_id
    name: Azure Client/Application ID
    type: azure_client_id
    severity: medium
    pattern: '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'
    context_required: true
    context_patterns:
      - 'azure'
      - 'client_id'
      - 'application_id'
    metadata:
      provider: azure

  - id: azure_tenant_id
    name: Azure Tenant ID
    type: azure_tenant_id
    severity: low
    pattern: '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'
    context_required: true
    context_patterns:
      - 'tenant'
      - 'directory'
    metadata:
      provider: azure

  - id: azure_sas_token
    name: Azure SAS Token
    type: azure_sas
    severity: high
    pattern: 'sv=20[0-9]{2}-[0-9]{2}-[0-9]{2}&s[a-z]=[a-z]+&s[a-z]+=[^&\s]+'
    verifier: azure_sas
    metadata:
      provider: azure
      service: storage

  # Alibaba Cloud
  - id: alibaba_access_key
    name: Alibaba Cloud Access Key ID
    type: alibaba_access_key
    severity: critical
    pattern: 'LTAI[a-zA-Z0-9]{20}'
    pair_with: alibaba_secret_key
    metadata:
      provider: alibaba_cloud

  - id: alibaba_secret_key
    name: Alibaba Cloud Secret Key
    type: alibaba_secret_key
    severity: critical
    pattern: '[a-zA-Z0-9]{30}'
    pair_with: alibaba_access_key
    context_required: true
    context_patterns:
      - 'alibaba'
      - 'aliyun'
      - 'LTAI'
    metadata:
      provider: alibaba_cloud

  # DigitalOcean
  - id: digitalocean_token
    name: DigitalOcean Access Token
    type: digitalocean_token
    severity: high
    pattern: 'dop_v1_[a-f0-9]{64}'
    verifier: digitalocean
    metadata:
      provider: digitalocean

  - id: digitalocean_spaces_key
    name: DigitalOcean Spaces Access Key
    type: digitalocean_spaces_key
    severity: high
    pattern: 'DO[A-Z0-9]{18}'
    pair_with: digitalocean_spaces_secret
    metadata:
      provider: digitalocean
      service: spaces

  # Terraform Cloud
  - id: terraform_cloud_token
    name: Terraform Cloud API Token
    type: terraform_token
    severity: high
    pattern: '[a-zA-Z0-9]{14}\.atlasv1\.[a-zA-Z0-9\-_]{60,}'
    metadata:
      provider: terraform_cloud
