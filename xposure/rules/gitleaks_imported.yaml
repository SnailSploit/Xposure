- id: gitleaks_vault-batch-token
  name: |-
    Detected a Vault Batch Token, risking unauthorized access to secret management services and sensitive data.
  type: vault_batch_token
  severity: high
  pattern: \b(hvb\.[\w-]{138,300})(?:[\x60'"\s;]|\\[nr]|$)
  exclude_patterns: []
  metadata:
    source: gitleaks
    gitleaks_id: vault-batch-token
    entropy_floor: 4
    keywords:
    - hvb.
- id: gitleaks_vault-service-token
  name: |-
    Identified a Vault Service Token, potentially compromising infrastructure security and access to sensitive credentials.
  type: vault_service_token
  severity: high
  pattern: \b((?:hvs\.[\w-]{90,120}|s\.(?i:[a-z0-9]{24})))(?:[\x60'"\s;]|\\[nr]|$)
  exclude_patterns:
  - s\.[A-Za-z]{24}
  metadata:
    source: gitleaks
    gitleaks_id: vault-service-token
    entropy_floor: 3.5
    keywords:
    - hvs.
    - s.
