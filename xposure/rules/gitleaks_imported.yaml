- id: gitleaks_1password-secret-key
  name: |-
    Uncovered a possible 1Password secret key, potentially compromising access to secrets in vaults.
  type: 1password_secret_key
  severity: medium
  pattern: |-
    \bA3-[A-Z0-9]{6}-(?:(?:[A-Z0-9]{11})|(?:[A-Z0-9]{6}-[A-Z0-9]{5}))-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}\b
  exclude_patterns: []
  metadata:
    source: gitleaks
    gitleaks_id: 1password-secret-key
    entropy_floor: 3.8
    keywords:
    - a3-
- id: gitleaks_1password-service-account-token
  name: |-
    Uncovered a possible 1Password service account token, potentially compromising access to secrets in vaults.
  type: 1password_service_account_token
  severity: high
  pattern: ops_eyJ[a-zA-Z0-9+/]{250,}={0,3}
  exclude_patterns: []
  metadata:
    source: gitleaks
    gitleaks_id: 1password-service-account-token
    entropy_floor: 4
    keywords:
    - ops_
