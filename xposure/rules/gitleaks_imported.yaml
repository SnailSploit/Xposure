    (?i)[\w.-]{0,50}?(?:adafruit)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9_-]{32})(?:[\x60'"\s;]|\\[nr]|$)
  exclude_patterns: []
  metadata:
    source: gitleaks
    gitleaks_id: adafruit-api-key
    keywords:
    - adafruit
