- id: gitleaks_github-app-token
  name: |-
    Identified a GitHub App Token, which may compromise GitHub application integrations and source code security.
  type: github_app_token
  severity: high
  pattern: (?:ghu|ghs)_[0-9a-zA-Z]{36}
  exclude_patterns: []
  metadata:
    source: gitleaks
    gitleaks_id: github-app-token
    entropy_floor: 3
    keywords:
    - ghu_
    - ghs_
- id: gitleaks_github-fine-grained-pat
  name: |-
    Found a GitHub Fine-Grained Personal Access Token, risking unauthorized repository access and code manipulation.
  type: github_fine_grained_pat
  severity: high
  pattern: github_pat_\w{82}
  exclude_patterns: []
  metadata:
    source: gitleaks
    gitleaks_id: github-fine-grained-pat
    entropy_floor: 3
    keywords:
    - github_pat_
- id: gitleaks_github-oauth
